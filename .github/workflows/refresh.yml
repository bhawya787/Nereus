name: Refresh Nereus Ocean Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run Nereus live data pipeline
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: |
          npx tsx -e "(async()=>{ const { runNereusPipeline } = await import('./server/nereusPipeline.ts'); await runNereusPipeline(true); })();"
      - name: Commit updated cache and manifest
        run: |
          git config user.name "nereus-bot"
          git config user.email "nereus-bot@users.noreply.github.com"
          git add cache/ web/data/ pipeline/logs/
          git diff --staged --quiet || git commit -m "chore(data): daily Nereus ocean telemetry refresh"
          git push
